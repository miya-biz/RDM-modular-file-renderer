name: Unit Tests

on:
  push:
    branches-ignore:
      - '[0-9]*'
  pull_request:
    branches: [ master, develop ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      build_image: ${{ steps.meta.outputs.build_image }}
      unoserver_image: ${{ steps.meta.outputs.unoserver_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        id: build
        run: |
          docker build -t rdm-mfr-test:${{ github.sha }} -f ./Dockerfile .

      - name: Build Docker image (build stage, used for unit tests)
        run: |
          docker build --target build -t rdm-mfr-build:${{ github.sha }} -f ./Dockerfile .

      - name: Build Docker image (unoserver)
        run: |
          docker build -t rdm-unoserver-test:${{ github.sha }} -f ./Dockerfile.unoserver .

      - name: Save Docker image
        run: |
          docker save rdm-mfr-test:${{ github.sha }} -o /tmp/rdm-mfr-image.tar

      - name: Save Docker image (build stage)
        run: |
          docker save rdm-mfr-build:${{ github.sha }} -o /tmp/rdm-mfr-build-image.tar

      - name: Save Docker image (unoserver)
        run: |
          docker save rdm-unoserver-test:${{ github.sha }} -o /tmp/rdm-unoserver-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-mfr-image
          path: /tmp/rdm-mfr-image.tar
          retention-days: 1

      - name: Upload Docker image artifact (build stage)
        uses: actions/upload-artifact@v4
        with:
          name: rdm-mfr-build-image
          path: /tmp/rdm-mfr-build-image.tar
          retention-days: 1

      - name: Upload Docker image artifact (unoserver)
        uses: actions/upload-artifact@v4
        with:
          name: rdm-unoserver-image
          path: /tmp/rdm-unoserver-image.tar
          retention-days: 1

      - name: Export image reference
        id: meta
        run: |
          echo "image=rdm-mfr-test:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_image=rdm-mfr-build:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "unoserver_image=rdm-unoserver-test:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  scan-image:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: mfr
            artifact: rdm-mfr-image
            image: ${{ needs.build-image.outputs.image }}
          - name: unoserver
            artifact: rdm-unoserver-image
            image: ${{ needs.build-image.outputs.unoserver_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: /tmp

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: /tmp/${{ matrix.target.artifact }}.tar
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results.json
          exit-code: '0'
          list-all-pkgs: 'true'

      - name: Convert Trivy report to SARIF
        env:
          TRIVY_SCANNERS: ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results.sarif \
            trivy-results.json

      - name: Render vulnerability summary
        env:
          IMAGE: ${{ matrix.target.image }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/ci/render-trivy-report.py \
            --input trivy-results.json \
            --output trivy-report.md \
            --image "$IMAGE" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
          tee -a "$GITHUB_STEP_SUMMARY" < trivy-report.md

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-${{ matrix.target.name }}
          path: |
            trivy-results.json
            trivy-results.sarif
            trivy-report.md
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-image-${{ matrix.target.name }}

  comment-image-scan:
    runs-on: ubuntu-latest
    needs: scan-image
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download vulnerability summaries
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-image-scan-*
          path: reports

      - name: Combine summaries
        run: |
          set -euo pipefail
          cat reports/trivy-image-scan-mfr/trivy-report.md reports/trivy-image-scan-unoserver/trivy-report.md > trivy-report.md

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comments_endpoint="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          comment_id="$({
            gh api --paginate "$comments_endpoint" --jq \
              '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- trivy-image-scan -->"))) | .id'
          } | sed -n '1p')"
          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@trivy-report.md
          else
            gh api \
              --method POST \
              "$comments_endpoint" \
              -F body=@trivy-report.md
          fi

  tests:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test_build: [mfr]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact (build stage)
        uses: actions/download-artifact@v4
        with:
          name: rdm-mfr-build-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/rdm-mfr-build-image.tar

      - name: Run matrix job
        env:
          TEST_BUILD: ${{ matrix.test_build }}
          MFR_TEST_IMAGE: ${{ needs.build-image.outputs.build_image }}
        run: |
          bash .github/scripts/ci/run-tests.sh "$TEST_BUILD"
